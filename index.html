// Keep the school-year return route when this game is opened with ?ano=...
function configurePortalNavigation(){
  const base='https://www.recreiodigital.pt/';
  const routes={pre:'pre-escolar','pre-escolar':'pre-escolar','1':'1-ano','2':'2-ano','3':'3-ano','4':'4-ano','1-ano':'1-ano','2-ano':'2-ano','3-ano':'3-ano','4-ano':'4-ano'};
  const requested=new URLSearchParams(location.search).get('ano');
  let route=Object.prototype.hasOwnProperty.call(routes,requested)?routes[requested]:null;
  if(!route&&document.referrer){
    try{
      const source=new URL(document.referrer);
      if(['recreiodigital.pt','www.recreiodigital.pt'].includes(source.hostname)){
        const match=source.pathname.match(/^\/(pre-escolar|[1-4]-ano)(?:\/|$)/);
        if(match)route=match[1];
      }
    }catch{}
  }
  document.getElementById('backToGames').href=route?base+route+'/index.html':base+'#jogos';
}

// Cache smooth centreline samples without repeatedly asking the SVG renderer
// to recalculate a long, self-crossing curve during a pupil's pointer movement.
function buildTraceGeometry(path){
  const tokens=path.match(/[MLC]|-?\d+(?:\.\d+)?/g)||[];
  const points=[];let i=0,position={x:0,y:0},distance=0;
  const add=(p,move=false)=>{
    if(points.length&&!move)distance+=Math.hypot(p.x-position.x,p.y-position.y);
    points.push({length:distance,point:p});position=p;
  };
  while(i<tokens.length){
    const command=tokens[i++];
    if(command==='M')add({x:Number(tokens[i++]),y:Number(tokens[i++])},true);
    else if(command==='L')add({x:Number(tokens[i++]),y:Number(tokens[i++])});
    else if(command==='C'){
      const a=position,b={x:Number(tokens[i++]),y:Number(tokens[i++])},
        c={x:Number(tokens[i++]),y:Number(tokens[i++])},d={x:Number(tokens[i++]),y:Number(tokens[i++])};
      for(let k=1;k<=64;k++){
        const t=k/64,v=1-t;
        add({x:v*v*v*a.x+3*v*v*t*b.x+3*v*t*t*c.x+t*t*t*d.x,
             y:v*v*v*a.y+3*v*v*t*b.y+3*v*t*t*c.y+t*t*t*d.y});
      }
    }else throw Error('Traçado desconhecido');
  }
  const scale=len/distance;
  geometryPoints=points.map(p=>({length:p.length*scale,point:p.point}));

// Fit the complete letter, including its wide outline and any dot, to the
// writing area instead of reserving the empty margins of the source model.
function fitLetterToWritingArea(config){
  let left=Infinity,top=Infinity,right=-Infinity,bottom=-Infinity;
  for(const sample of geometryPoints){
    const p=sample.point;
    left=Math.min(left,p.x);right=Math.max(right,p.x);
    top=Math.min(top,p.y);bottom=Math.max(bottom,p.y);
  }
  const halfStroke=29;
  left-=halfStroke;right+=halfStroke;top-=halfStroke;bottom+=halfStroke;
  if(config.dot){
    const d=config.dot;
    left=Math.min(left,d.x-d.r);right=Math.max(right,d.x+d.r);
    top=Math.min(top,d.y-d.r);bottom=Math.max(bottom,d.y+d.r);
  }
  const margin=16;
  svg.setAttribute('viewBox',`${left-margin} ${top-margin} ${right-left+margin*2} ${bottom-top+margin*2}`);
}

  let low=0,high=geometryPoints.length-1;
  while(low<high){const mid=Math.ceil((low+high)/2);if(geometryPoints[mid].length<=length)low=mid;else high=mid-1}
  const a=geometryPoints[low],b=geometryPoints[Math.min(low+1,geometryPoints.length-1)];
  const ratio=b.length>a.length?(length-a.length)/(b.length-a.length):0;
  return {x:a.point.x+(b.point.x-a.point.x)*ratio,y:a.point.y+(b.point.y-a.point.y)*ratio};
}
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function pos(e){
  const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;
  const m=svg.getScreenCTM();return m?p.matrixTransform(m.inverse()):{x:-999,y:-999};
}
function tone(freq=650){
  if(!sound)return;
  try{
    audioCtx??=new(window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==='suspended')audioCtx.resume();
    const o=audioCtx.createOscillator(),g=audioCtx.createGain();
    o.type='sine';o.frequency.value=freq;
    g.gain.setValueAtTime(.0001,audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(.10,audioCtx.currentTime+.015);
    g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+.16);
    o.connect(g).connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+.17);
  }catch{}
}
function setHint(){
  hint.textContent=LETTERS[letter].hints?.[phaseIndex]||'👆 Começa na bolinha rosa e segue o tracejado!';
}
function makeArrows(){
  arrows.replaceChildren();
  const phase=phases[phaseIndex]||{start:0,end:len};
  const ratios=LETTERS[letter].arrowRatios?.[phaseIndex]||(letter==='p'?[.24,.58,.85]:[.19,.39,.61,.84]);
  for(const ratio of ratios){
    const length=phase.start+(phase.end-phase.start)*ratio;
    const p=at(length),q=at(Math.min(phase.end,length+3));
    const a=Math.atan2(q.y-p.y,q.x-p.x)*180/Math.PI;
    const el=document.createElementNS(NS,'path');
    el.setAttribute('d',LETTERS[letter].hints?'M -8 -5 L 2 0 L -8 5 Z':'M -10 -6 L 2 0 L -10 6 Z');
    el.setAttribute('transform',`translate(${p.x} ${p.y}) rotate(${a})`);
    el.setAttribute('class','arrow');arrows.appendChild(el);
  }
}
function draw(){
  paint.style.strokeDashoffset=Math.max(0,len-progress);
  for(const stroke of strokePaints){
    const local=Math.max(0,Math.min(stroke.length,progress-stroke.offset));
    stroke.el.style.strokeDashoffset=stroke.length-local;
  }
  const p=at(progress);tip.setAttribute('cx',p.x);tip.setAttribute('cy',p.y);
  const showPhaseStart=LETTERS[letter].liftBefore?.includes(phaseIndex)&&progress<phases[phaseIndex].start+20;
  start.style.opacity=progress<20||showPhaseStart?1:0;
  hint.style.opacity=LETTERS[letter].hints||progress<30?1:0;
}
function stop(){dragging=false;activePointer=null;lastPointer=null}
function finish(){
  if(letter==='i'&&!awaitDot){
    awaitDot=true;stop();tip.style.opacity=0;arrows.style.opacity=0;
    hint.textContent='👆 Toca no ponto do i para terminar!';hint.style.opacity=1;
    dotGuide.style.opacity=1;tone(740);return;
  }
  done=true;stop();tip.style.opacity=0;arrows.style.opacity=0;guide.style.opacity=0;
  hint.textContent=`⭐ Muito bem! Escreveste a letra ${letter}!`;hint.style.opacity=1;
  document.getElementById('successMessage').textContent=`Fizeste a letra ${letter}!`;
  celebrate.setAttribute('aria-hidden','false');celebrate.classList.add('show');
  for(let i=0;i<12;i++){
    const s=document.createElement('span');s.className='spark';s.textContent=['⭐','✨','💛','🌟'][i%4];
    s.style.setProperty('--x',`${(i%2?-1:1)*(40+(i*37)%320)}px`);
    s.style.setProperty('--y',`${(i%3?-1:1)*(30+(i*43)%220)}px`);
    celebrate.appendChild(s);setTimeout(()=>s.remove(),1700);
  }
  tone(784);setTimeout(()=>tone(988),130);setTimeout(()=>tone(1175),270);
}
function nextPhase(){
  if(phaseIndex+1<phases.length){
    phaseIndex++;
    if(LETTERS[letter].liftBefore?.includes(phaseIndex)){
      stop();progress=phases[phaseIndex].start+.05;
      const first=at(progress);start.setAttribute('cx',first.x);start.setAttribute('cy',first.y);
      draw();
    }
    setHint();makeArrows();tone(660+phaseIndex*50);
  }
  else{progress=len;draw();finish()}
}
function advance(e){
  if(!dragging||done||e.pointerId!==activePointer)return;
  const p=pos(e),movement=lastPointer?dist(p,lastPointer):0;lastPointer=p;
  if(movement<.35)return;
  const phase=phases[phaseIndex];
  // Never jump over a reversal of direction, even at a crossing of the stem.
  const max=Math.min(phase.end,progress+Math.min(90,Math.max(28,movement*1.7+8)));
  let best=progress,bestDist=dist(p,at(progress));
  for(let index=Math.ceil((progress+1)/2);index<tracePoints.length&&tracePoints[index].length<=max;index++){
    const sample=tracePoints[index];
    const distance=dist(p,sample.point);
    if(distance<bestDist){bestDist=distance;best=sample.length}
  }
  const endDistance=dist(p,at(max));
  if(endDistance<bestDist){bestDist=endDistance;best=max}
  const tolerance=assisted?42:29;
  if(bestDist<tolerance&&best>progress){
    progress=best;draw();
    if(phase.end-progress<6&&dist(p,phase.endPoint)<tolerance){
      progress=phase.end;draw();nextPhase();
    }
  }
}
svg.addEventListener('pointerdown',e=>{
  if(done||dragging||demoActive)return;
  const p=pos(e);
  if(awaitDot){
    const targetDot=LETTERS[letter].dot||{x:244,y:77,r:29};
    if(letter==='i'&&dist(p,targetDot)<targetDot.r+11){
      dotPaint.style.display='';dotGuide.style.opacity=0;finish();e.preventDefault();
    }
    return;
  }
  if(e.pointerType==='mouse'&&e.button!==0)return;
  if(dist(p,at(progress))<(assisted?56:35)){
    dragging=true;activePointer=e.pointerId;lastPointer=p;
    svg.setPointerCapture(e.pointerId);e.preventDefault();
  }
});
svg.addEventListener('pointermove',e=>{if(dragging){
  const samples=typeof e.getCoalescedEvents==='function'?e.getCoalescedEvents():[];
  for(const sample of samples.length?samples:[e]){if(dragging)advance(sample)}
  e.preventDefault();
}});
for(const type of ['pointerup','pointercancel','lostpointercapture']){
  svg.addEventListener(type,e=>{if(e.pointerId===activePointer)stop()});
}
function reset(){
  stopDemo();stop();progress=0;phaseIndex=0;done=false;awaitDot=false;
  tip.style.opacity=1;arrows.style.opacity=1;guide.style.opacity=1;
  dotPaint.style.display='none';dotGuide.style.opacity=1;
  celebrate.classList.remove('show');celebrate.setAttribute('aria-hidden','true');celebrate.querySelectorAll('.spark').forEach(s=>s.remove());
  const first=at(0);start.setAttribute('cx',first.x);start.setAttribute('cy',first.y);
  setHint();makeArrows();draw();
}
function selectLetter(next){
  if(!LETTERS[next])return;
  letter=next;const config=LETTERS[letter];
  svg.dataset.letter=letter;svg.setAttribute('viewBox',config.viewBox||'0 0 520 460');
  svg.setAttribute('aria-label',`Letra ${letter} manuscrita: segue o tracejado preto dentro do contorno.`);
  panel.classList.toggle('is-guided',Boolean(config.hints));
  const rows=config.rows||(letter==='p'?[
    {y:52,stroke:'#a9d9f7',width:2},
    {y:116,stroke:'#f6a5cb',width:2,dash:'9 7'},
    {y:301,stroke:'#77bfea',width:2.6},
    {y:477,stroke:'#a9d9f7',width:2}
  ]:defaultRows);
  notebookLines.forEach((line,i)=>{
    const row=rows[i];line.setAttribute('y1',row.y);line.setAttribute('y2',row.y);
    line.setAttribute('stroke',row.stroke);line.setAttribute('stroke-width',row.width);
    if(row.dash)line.setAttribute('stroke-dasharray',row.dash);else line.removeAttribute('stroke-dasharray');
  });
  for(const el of document.querySelectorAll('#letter > path')){
    el.setAttribute('d',el===guide?config.guide||config.path:config.path);
  }
  len=shape.getTotalLength();paint.style.strokeDasharray=`${len} ${len}`;
  buildTraceGeometry(config.path);
  fitLetterToWritingArea(config);
  tracePoints=[];for(let length=0;length<=len;length+=2){tracePoints.push({length,point:at(length)})}
  multiPaint.replaceChildren();strokePaints=[];
  paint.style.display=config.strokes?'none':'';
  let strokeOffset=0;
  for(const path of config.strokes||[]){
    const el=document.createElementNS(NS,'path');el.setAttribute('d',path);el.setAttribute('class','written');
    multiPaint.appendChild(el);const length=el.getTotalLength();
    el.style.strokeDasharray=`${length} ${length}`;el.style.strokeDashoffset=length;
    strokePaints.push({el,length,offset:strokeOffset});strokeOffset+=length;
  }
  let offset=0;
  phases=(config.phases||[config.path]).map(path=>{
    measure.setAttribute('d',path);const length=measure.getTotalLength();
    const coordinates=path.match(/-?\d+(?:\.\d+)?/g).map(Number);
    const phase={start:offset,end:offset+length,endPoint:{x:coordinates.at(-2),y:coordinates.at(-1)}};offset+=length;return phase;
  });
  // SVG curve length estimates differ slightly for split and joined paths.
  const scale=len/offset;phases=phases.map(p=>({...p,start:p.start*scale,end:p.end*scale}));
  phases[phases.length-1].end=len;
  dot.style.display=letter==='i'?'':'none';
  if(config.dot){
    const d=config.dot;
    for(const circle of dot.querySelectorAll('circle')){
      circle.setAttribute('cx',d.x);circle.setAttribute('cy',d.y);
      circle.setAttribute('r',circle.classList.contains('dot-outline')?d.r:
        circle.classList.contains('dot-white')?d.r-4:
        circle.classList.contains('dot-green')?d.r-5:d.r*.46);
    }
  }
  for(const key of Object.keys(LETTERS)){
    document.getElementById(LETTERS[key].buttonId||'choose'+key.toUpperCase()).setAttribute('aria-pressed',key===letter);
  }
  reset();
}

function stopDemo(){
  demoActive=false;cancelAnimationFrame(demoFrame);clearTimeout(demoTimer);
  document.getElementById('demo').textContent='▶ Ver como se faz';
  document.getElementById('demo').setAttribute('aria-label','Ver como se faz');
}
function playDemo(){
  if(demoActive){reset();return}
  reset();demoActive=true;
  const demoButton=document.getElementById('demo');
  demoButton.textContent='■ Parar';demoButton.setAttribute('aria-label','Parar demonstração');
  const runPhase=index=>{
    if(!demoActive)return;
    phaseIndex=index;progress=phases[index].start+(index&&LETTERS[letter].liftBefore?.includes(index)?0.05:0);
    const first=at(progress);start.setAttribute('cx',first.x);start.setAttribute('cy',first.y);
    setHint();hint.textContent='👀 '+hint.textContent;makeArrows();draw();
    const phase=phases[index],duration=Math.max(1800,(phase.end-phase.start)*8);
    let begin=null;
    const tick=now=>{
      if(!demoActive)return;
      begin??=now;const ratio=Math.min(1,(now-begin)/duration);
      progress=phase.start+(phase.end-phase.start)*ratio;draw();
      if(ratio<1){demoFrame=requestAnimationFrame(tick);return}
      if(index+1<phases.length){demoTimer=setTimeout(()=>runPhase(index+1),LETTERS[letter].liftBefore?.includes(index+1)?800:350)}
      else{
        if(letter==='i'){dotPaint.style.display='';dotGuide.style.opacity=0}
        hint.textContent='⭐ Agora é a tua vez!';hint.style.opacity=1;
        demoTimer=setTimeout(()=>{if(demoActive){reset();hint.textContent='👆 Agora faz tu! Começa na bolinha rosa.'}},1800);
      }
    };
    demoFrame=requestAnimationFrame(tick);
  };
  runPhase(0);
}
document.getElementById('demo').addEventListener('click',playDemo);
document.getElementById('assist').addEventListener('click',e=>{
  assisted=!assisted;e.currentTarget.setAttribute('aria-pressed',assisted);
  e.currentTarget.textContent=assisted?'🖐️ Com ajuda':'✏️ Mais precisão';
  e.currentTarget.setAttribute('aria-label',assisted?'Mais ajuda no traçado':'Traçado com mais precisão');
});

document.getElementById('restart').addEventListener('click',reset);
for(const key of Object.keys(LETTERS)){
  document.getElementById(LETTERS[key].buttonId||'choose'+key.toUpperCase()).addEventListener('click',()=>selectLetter(key));
}
document.getElementById('sound').addEventListener('click',e=>{
  sound=!sound;e.currentTarget.textContent=sound?'🔊':'🔇';
  e.currentTarget.setAttribute('aria-label',sound?'Desativar som':'Ativar som');
});
for(let i=0;i<48;i++){
  const s=document.createElement('i');s.className='star';
  s.style.left=((i*37+11)%97)+'%';s.style.top=((i*59+7)%94)+'%';
  s.style.setProperty('--dur',(1.2+(i%7)*.4)+'s');s.style.setProperty('--delay',(-i*.27)+'s');
  document.getElementById('stars').appendChild(s);
}

const VOWEL_KEYS=new Set(['a','A','e','E','i','I','o','O','u','U']);
function showLetterBank(bank,switchLetter=true){
  const vowels=bank==='vowels';
  document.getElementById('vowelBank').setAttribute('aria-pressed',vowels);
  document.getElementById('consonantBank').setAttribute('aria-pressed',!vowels);
  for(const key of Object.keys(LETTERS)){
    document.getElementById(LETTERS[key].buttonId||'choose'+key.toUpperCase()).hidden=VOWEL_KEYS.has(key)!==vowels;
  }
  if(switchLetter&&VOWEL_KEYS.has(letter)!==vowels)selectLetter(vowels?'a':'p');
}
document.getElementById('vowelBank').addEventListener('click',()=>showLetterBank('vowels'));

showLetterBank('consonants',false);
